<style>
/* Layout: one-screen tool. Field-notebook sidebar on the left, drafting table (Three.js stage) on the right; stacks on phones. */
:root{
  --bg:#ECEEE8; --panel:#F7F8F4; --ink:#1E2722; --muted:#5E6B63; --line:#CBD2C9;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#141917; --panel:#1B211E; --ink:#E5EAE4; --muted:#9AA79F; --line:#2E3833;
  --accent:#5FB394; --accent-ink:#0E1512; --hi:#F0B04A; --danger:#E0745F;
  --stage:#1E2421; --grid-minor:#2A322E; --grid-major:#3D4842; --floor:#3A3528; color-scheme:dark}
[hidden]{display:none!important}
.itrow{gap:4px;margin:2px 0}.itrow.on .itn{border-color:var(--accent,#3a7);font-weight:600}
.itrow .lk{border:1px solid var(--line);background:none;border-radius:6px;width:32px;height:30px;cursor:pointer;font-size:14px}
.itrow .itn{flex:1;display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line);background:none;color:inherit;border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}

.dot.ok{background:var(--accent)} .dot.warn{background:var(--hi)}
main{display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}

.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px;display:flex;flex-direction:column;gap:16px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}

input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;color:var(--ink)}
input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.cat{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:6px}
.note{font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:10px;align-items:center;font-size:12px}

.lbl.sel{outline:1.5px solid var(--hi)}

.scale{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--font-mono);font-size:11px}
.scale .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-bottom:2px}
.coord{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.overlay .empty{background:var(--panel);pointer-events:auto;max-width:320px;text-align:center}
.photo{position:absolute;right:10px;bottom:10px;z-index:3;width:min(280px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;max-height:calc(100% - 70px);overflow:auto}

.fpPad button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;cursor:pointer;touch-action:none;color:inherit}
.fpPad button.on{background:var(--accent);color:var(--accent-ink)}
.fpUD{grid-template-columns:repeat(2,66px)}
.fpEye{display:flex;align-items:center;gap:6px}.fpEye input{width:110px}
.photo .rr{display:grid;grid-template-columns:64px 1fr 48px;gap:6px;align-items:center}

kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:58vh auto;overflow:auto}

  .app{height:auto;min-height:100%}
  html,body{height:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* panel toggle + compact toolbar options (phones) */
.seg .sideBtn{font-size:16px;line-height:1;padding:6px 10px;border-right:1px solid var(--line)}
.tbBtn{display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.sideShade{display:none}
.sideClose{display:none;margin:8px 10px 0;align-self:flex-end;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
body.hideSide main{grid-template-columns:1fr}
body.hideSide aside{display:none}
@media (max-width:760px){
  header{padding-block:6px} header .sub{display:none} header h1{font-size:16px}
  body.hideSide main{grid-template-rows:calc(100dvh - 44px) auto}
  .tbBtn{display:inline-flex} .tb{display:none} body.tbOpen .tb{display:flex;flex-wrap:wrap}
  .seg button{padding:6px 9px}
}
/* phone held sideways: the 3D view gets the whole screen, the side panel slides in over it */
@media (orientation:landscape) and (max-height:540px){
  header{display:none}
  html,body{height:100%!important} .app{height:100dvh!important;min-height:0!important;grid-template-rows:1fr!important}
  main{grid-template-columns:1fr!important;grid-template-rows:1fr!important;overflow:hidden!important;position:relative}
  aside{display:flex!important;position:absolute;z-index:30;left:0;top:0;bottom:0;width:min(340px,58vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 24px rgba(0,0,0,.35);overflow:auto!important;border-top:0!important;order:0!important;padding-left:env(safe-area-inset-left,0px)}
  body.sideOpen aside{transform:none}
  .sideClose{display:block}
  body.sideOpen .sideShade{display:block;position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.25)}
  .stage{order:0!important;height:100dvh}
  .toolbar{top:6px;left:max(6px,env(safe-area-inset-left,0px));right:max(6px,env(safe-area-inset-right,0px));gap:6px}
  .seg button{padding:5px 9px;font-size:13px}
  .tbBtn{display:inline-flex} .tb{display:none} body.tbOpen .tb{display:flex;flex-wrap:wrap}
  .fp{transform:scale(.78);transform-origin:bottom right;right:max(6px,env(safe-area-inset-right,0px));bottom:6px}
  .photo{max-height:calc(100% - 60px);overflow:auto}
  .lbl{font-size:10px}
}
</style>

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const CATS = ["帳篷","車輛","寢具","桌椅","廚房","焚火","照明","影音","收納","環境","其他"];
const SHAPES = {box:"方塊",table:"桌子",chair:"椅子",mattress:"床墊／睡墊",cot:"高腳床（充氣床＋床架）",sofa:"沙發（座墊＋靠背＋扶手）",cylinder:"圓柱（焚火台、水桶）",tree:"樹木（寬＝樹幹直徑）",screen:"投影布幕（寬＝含支架總寬）",slattable:"木條桌（可延伸）",hotpot:"火鍋（含卡式爐）",tent:"帳篷"};

/* ---------------- data store: cloud db when available, otherwise this browser ---------------- */
const S = { gear:{}, layouts:{}, mode:"local", db:null, ready:false };
const LS_KEY = "campplan.v1";
function lsLoad(){ try{ const j = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); S.gear=j.gear||{}; S.layouts=j.layouts||{}; }catch(e){} }
function lsSave(){ if(S.mode!=="local") return; try{ localStorage.setItem(LS_KEY, JSON.stringify({gear:S.gear,layouts:S.layouts})); }catch(e){} }
function setStatus(kind, text){ $("#stDot").className = "dot " + kind; $("#stText").textContent = text; }

const pending = {};
function writeDoc(col, id, data){
  if(S.mode==="db"){
    clearTimeout(pending[col+id]);
    pending[col+id] = setTimeout(() => {
      S.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(data))).catch(e => setStatus("warn","儲存失敗：" + (e && e.message || e && e.code || "")));
    }, 250);
  } else lsSave();
}
function deleteDoc(col, id){
  if(S.mode==="db") S.db.collection(col).doc(id).delete().catch(()=>setStatus("warn","刪除失敗"));
  else lsSave();
}
function saveGear(id){ writeDoc("gear", id, S.gear[id]); }
/* undo / redo: per-layout snapshots of items, recorded whenever a layout is saved */
const HIST={};
function histOf(id){ const L=S.layouts[id]; if(!L) return null; if(!HIST[id]) HIST[id]={snap:JSON.stringify(L.items||[]), undo:[], redo:[]}; return HIST[id]; }
function histRecord(id){ if(U.noHist) return; const L=S.layouts[id], h=histOf(id); if(!L||!h) return; const cur=JSON.stringify(L.items||[]); if(cur!==h.snap){ h.undo.push(h.snap); if(h.undo.length>100) h.undo.shift(); h.redo=[]; h.snap=cur; } }
function histStep(back){ const id=U.layoutId, L=S.layouts[id], h=histOf(id); if(!L||!h) return; const from=back?h.undo:h.redo, to=back?h.redo:h.undo; if(!from.length) return;
  to.push(JSON.stringify(L.items||[])); L.items=JSON.parse(from.pop()); h.snap=JSON.stringify(L.items);
  U.noHist=true; saveLayout(id); U.noHist=false; const ok=new Set(L.items.map(i=>i.uid)); U.multi=(U.multi||[]).filter(x=>ok.has(x)); if(U.sel&&!ok.has(U.sel)) U.sel=U.multi[U.multi.length-1]||null; rebuildScene(); renderLayoutPane(); }
function saveLayout(id){ histRecord(id); S.layouts[id].updatedAt = new Date().toISOString(); writeDoc("layouts", id, S.layouts[id]); }

/* ---- website cloud save (Firebase). Only used outside Claude, when firebase-config.js has a config.
   No sign-in: anyone with the link can view and edit (Roy's choice). ---- */
async function fbInit(){
  if(!(window.FB_CONFIG && window.FB_CONFIG.apiKey && window.firebase)) return null;
  try{
    firebase.initializeApp(window.FB_CONFIG);
    const raw = firebase.firestore();
    /* all data lives in collections named campplan_* so the Firebase project can be shared with other apps */
    /* each doc is stored as {_json:"..."} because Firestore rejects nested arrays (e.g. tent door lists) */
    const enc = d => ({_json: JSON.stringify(d)}), dec = x => (x && typeof x._json === "string") ? JSON.parse(x._json) : (x||{});
    const wrapSnap = snap => ({ empty: snap.empty, docs: snap.docs.map(d => ({ id: d.id, data: () => dec(d.data()) })) });
    const fs = {
      collection: c => { const col = raw.collection("campplan_" + c); return {
        doc: id => { const r = col.doc(id); return { _raw: r, set: d => r.set(enc(d)), delete: () => r.delete(),
          get: () => r.get().then(x => ({ exists: x.exists, data: () => dec(x.data()) })) }; },
        get: () => col.get().then(wrapSnap),
        onSnapshot: (cb, err) => col.onSnapshot(snap => cb(wrapSnap(snap)), err) }; },
      batch: () => { const b = raw.batch(); return { set: (ref, d) => b.set(ref._raw, enc(d)), commit: () => b.commit() }; }
    };
    /* fill the cloud before showing it; if the cloud can't be reached or written, stay on this browser's copy */
    await fbSyncSeed(fs);
    await fbUploadLocal(fs);
    return fs;
  }catch(e){ console.warn("firebase", e); fbInit.err = (e && (e.code || e.message)) || "unknown"; return null; }
}
/* first visit fills the cloud from seed.json (+ this browser's saved layouts); a newer seedVersion adds new gear */
async function fbSyncSeed(fs){
  const j = await (await fetch("data/seed.json",{cache:"no-cache"})).json(); const sv = j.seedVersion||1;
  const meta = await fs.collection("meta").doc("seed").get(); const cur = meta.exists ? (meta.data().v||0) : 0;
  if(cur >= sv) return;
  const gearSnap = await fs.collection("gear").get(), laySnap = await fs.collection("layouts").get();
  let loc = {}; try{ loc = JSON.parse(localStorage.getItem("campplan.v1")||"{}"); }catch(e){}
  const writes = [];
  /* only add gear the cloud doesn't have, so names or sizes people changed on the site are never overwritten */
  const haveGear = new Set(gearSnap.docs.map(d=>d.id));
  Object.entries(j.gear||{}).forEach(([k,v]) => { if(!haveGear.has(k)) writes.push(["gear",k,v]); });
  if(gearSnap.empty) Object.entries(loc.gear||{}).forEach(([k,v]) => { if(!(j.gear||{})[k]) writes.push(["gear",k,v]); });
  const have = new Set(laySnap.docs.map(d=>d.id));
  const lays = laySnap.empty ? {...(j.layouts||{}), ...(loc.layouts||{})} : (j.layouts||{});
  Object.entries(lays).forEach(([k,v]) => { if(!have.has(k)) writes.push(["layouts",k,v]); });
  for(let i=0;i<writes.length;i+=400){ const b = fs.batch(); writes.slice(i,i+400).forEach(([c,k,v]) => b.set(fs.collection(c).doc(k), JSON.parse(JSON.stringify(v)))); await b.commit(); }
  await fs.collection("meta").doc("seed").set({v:sv});
}
/* once per browser: layouts edited here before cloud save existed are uploaded if newer than the cloud copy */
async function fbUploadLocal(fs){
  if(localStorage.getItem("campplan.uploaded")) return;
  let loc = {}; try{ loc = JSON.parse(localStorage.getItem("campplan.v1")||"{}"); }catch(e){}
  const snap = await fs.collection("layouts").get(); const cloud = {}; snap.docs.forEach(d => cloud[d.id] = d.data());
  const t = x => Date.parse((x && x.updatedAt) || 0) || 0;
  const writes = Object.entries(loc.layouts||{}).filter(([k,v]) => !cloud[k] || t(v) > t(cloud[k]));
  if(writes.length){ const b = fs.batch(); writes.forEach(([k,v]) => b.set(fs.collection("layouts").doc(k), JSON.parse(JSON.stringify(v)))); await b.commit(); }
  localStorage.setItem("campplan.uploaded", "1");
}

async function initStore(){
  lsLoad();
  let db = null;
  try { if(window.claude && claude.use) db = await claude.use("db"); } catch(e){ db = null; }
  if(!db) db = await fbInit();
  if(!db){ S.mode="local";
    try{ const j = await (await fetch("data/seed.json",{cache:"no-cache"})).json(); const sv=j.seedVersion||1, mine=+(localStorage.getItem("campplan.seed")||0);
      if(!Object.keys(S.gear).length){ S.gear=j.gear||{}; S.layouts=j.layouts||{}; }
      else if(sv>mine){ Object.assign(S.gear, j.gear||{}); Object.entries(j.layouts||{}).forEach(([k,v])=>{ if(!S.layouts[k]) S.layouts[k]=v; }); }
      lsSave(); localStorage.setItem("campplan.seed", String(sv)); }catch(e){}
    S.ready=true; setStatus("warn", fbInit.err ? "雲端連線失敗（" + fbInit.err + "），先存在這台裝置" : "資料存在這台裝置的瀏覽器"); renderAll(); return; }
  S.db = db; S.mode = "db"; S.gear = {}; S.layouts = {};
  let got = 0;
  const timer = setTimeout(() => { if(!S.ready){ S.ready=true; renderAll(); setStatus("warn","雲端回應較慢，資料載入中…"); } }, 10000);
  const done = () => { got++; if(got>=2 && !S.ready){ S.ready=true; clearTimeout(timer); setStatus("ok","已同步到雲端"); renderAll(); } };
  const sub = (col, key) => db.collection(col).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = JSON.parse(JSON.stringify(d.data()||{})); });
    S[key] = m; done(); if(S.ready){ setStatus("ok","已同步到雲端"); scheduleRender(); }
  }, e => { setStatus("warn","雲端讀取失敗：" + (e && e.code || "")); done(); });
  sub("gear","gear"); sub("layouts","layouts");
}

      <kbd>Ctrl</kbd>+<kbd>G</kbd> 群組・<kbd>Ctrl</kbd>+<kbd>U</kbd> 解散群組<br>
      <kbd>Ctrl</kbd>+<kbd>C</kbd> 複製・<kbd>Ctrl</kbd>+<kbd>X</kbd> 剪下・<kbd>Ctrl</kbd>+<kbd>V</kbd> 貼上（再點畫面放置）<br>
      <kbd>Ctrl</kbd>+<kbd>D</kbd> 再製（偏移一點）・<kbd>+</kbd> 原地再製<br>
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> 復原・<kbd>Ctrl</kbd>+<kbd>Y</kbd> 重做<br>
      <kbd>Delete</kbd> 刪除・方向鍵 微調 1 cm（<kbd>Shift</kbd>＋方向鍵 10 cm）<br>

    const counts = {}; L.items.forEach(i=>counts[i.gearId]=(counts[i.gearId]||0)+1);

/* sidebar events (delegated) */
function setTab(t){ U.tab=t; $("#tabLayout").setAttribute("aria-selected", t==="layout"); $("#tabGear").setAttribute("aria-selected", t==="gear"); $("#paneLayout").hidden = t!=="layout"; $("#paneGear").hidden = t!=="gear"; U.armed=null; rebuildScene(); updateOverlay(); fitView(); }
$("#tabLayout").onclick = () => setTab("layout");
$("#tabGear").onclick = () => setTab("gear");

function newLayout(kind){
  const id = uid("l");
  if(kind==="site") S.layouts[id] = {name:"新營位", kind:"site", siteW:1000, siteD:800, items:[]};
  else { const t = gearList().find(([,g])=>g.shape==="tent"); S.layouts[id] = {name:(t?t[1].name:"帳篷")+" 帳內", kind:"tent", tentId:t&&t[0], items:[]}; }
  U.layoutId = id; U.sel = null; saveLayout(id); saveUI(); renderAll(); fitView();
}
$("#paneLayout").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; const L = curLayout();
  if(b.id==="newSite") return newLayout("site");
  if(b.id==="newTent") return newLayout("tent");
  if(b.id==="dupLayout" && L){ const id=uid("l"); S.layouts[id]=JSON.parse(JSON.stringify(L)); S.layouts[id].name=L.name+" 副本"; U.layoutId=id; saveLayout(id); saveUI(); return renderAll(); }
  if(b.id==="delLayout" && L){ if(U.armed!=="layout"){ U.armed="layout"; return renderLayoutPane(); } const id=U.layoutId; delete S.layouts[id]; deleteDoc("layouts",id); U.armed=null; U.layoutId=null; U.sel=null; renderAll(); return fitView(); }
  if(b.dataset.add && L){ addItem(b.dataset.add); return; }
  if(b.dataset.door && L){
    const tgt = b.dataset.scope==="layout" ? (L.tentOpts = L.tentOpts || {}) : (()=>{ const it=L.items.find(i=>i.uid===U.sel); return it ? (it.tent = it.tent || {}) : null; })();
    if(!tgt) return; tgt.doors = tgt.doors || {}; const k=b.dataset.door; tgt.doors[k] = tgt.doors[k]==="open" ? "closed" : "open";
    saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); return; }
  if(b.dataset.lock && L){ const it=L.items.find(i=>i.uid===b.dataset.lock); if(it){ it.locked=!it.locked; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); } return; }
  if(b.dataset.pick && L){ const id=b.dataset.pick; if(U.multiMode || e.shiftKey || e.ctrlKey || e.metaKey) toggleSel(id); else if(U.sel===id && selIds().length===grpMembers(id).length) clearSel(); else selectOne(id); renderLayoutPane(); rebuildScene(); return; }
  if(b.dataset.ext!==undefined && L){ const it=selItem(); if(it){ it.ext=+b.dataset.ext; saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); } return; }
  if(b.id==="mMode"){ U.multiMode=!U.multiMode; renderLayoutPane(); return; }
  if(b.id==="mAll" && L){ U.multi=L.items.filter(i=>!i.locked && S.gear[i.gearId]).map(i=>i.uid); U.sel=U.multi[U.multi.length-1]||null; renderLayoutPane(); rebuildScene(); return; }
  if(b.id==="mRot") return rotateGroup(90);
  if(b.id==="mDup") return dupGroup();
  if(b.id==="gGroup") return groupSel();
  if(b.id==="gUngroup") return ungroupSel();
  if(b.id==="hUndo") return histStep(true);
  if(b.id==="hRedo") return histStep(false);
  if(b.dataset.cp) return copyTo(b.dataset.cp);
  if(b.id==="cpToLayout"){ const sel=$("#cpLayout"); if(sel) copyToLayout(sel.value); return; }
  if(b.id==="cpPlace"){ U.placing=!U.placing; renderLayoutPane(); return; }
  if(b.id==="mDel") return delGroup();
  if(b.id==="mNone"){ clearSel(); renderLayoutPane(); rebuildScene(); return; }
  if(b.id==="iYTSound"){ ytMuted=!ytMuted; ytCmd(ytMuted?"mute":"unMute"); ytCmd("playVideo"); renderLayoutPane(); return; }
  if(b.id==="iScreen"){ const it=selItem(); if(it){ it.on=!it.on; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); } return; }
  if(b.id==="iMute" && movieVideo){ movieVideo.muted=!movieVideo.muted; if(!movieVideo.paused||screensOn) movieVideo.play().catch(()=>{}); renderLayoutPane(); return; }
  if(b.dataset.fire && L){ const it=selItem(); if(it){ const k=b.dataset.fire; it.fire = k==="off" ? false : k==="smoke" ? "smoke" : true; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); } return; }
  if(b.id==="iBoil"){ const it=selItem(); if(it){ it.boil=!it.boil; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); } return; }
  if(b.id==="iLock"){ const it=selItem(); if(it){ it.locked=!it.locked; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); } return; }
  if(b.id==="iRot") return rotateSel(90);
  if(b.id==="iDup") return dupSel();
  if(b.id==="iDel") return delSel();
});
$("#paneLayout").addEventListener("change", e => {
  const t = e.target; const L = curLayout();
  if(t.id==="iElev"){ const it=L.items.find(i=>i.uid===U.sel); if(it){ it.elev=Math.max(0,+t.value||0); saveLayout(U.layoutId); rebuildScene(); } return; }
  if(t.id==="iYT"){ const it=L.items.find(i=>i.uid===U.sel); if(it){ it.yt=t.value.trim(); saveLayout(U.layoutId); rebuildScene(); } return; }
  if(t.id==="iStand"){ const it=L.items.find(i=>i.uid===U.sel); if(it){ it.stand=t.checked; saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); } return; }
  if(t.id==="iMovie" && t.files[0]){ setMovieFile(t.files[0]); return; }

  if(t.id==="lGround"){ L.ground=t.value; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene(); }
  if(t.id==="lGroundColor"){ L.groundColor=t.value; saveLayout(U.layoutId); rebuildScene(); }
  if(t.id==="lTent"){ L.tentId=t.value; saveLayout(U.layoutId); rebuildScene(); fitView(); }
  const it = L.items.find(i=>i.uid===U.sel);
  if(it && (t.id==="iX"||t.id==="iY"||t.id==="iR")){ it.x=+$("#iX").value||0; it.y=+$("#iY").value||0; it.rot=((+$("#iR").value||0)%360+360)%360; saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); }
});

$("#paneGear").addEventListener("click", e => {
  const rb = e.target.closest("[data-rename]");
  if(rb){ U.renaming=rb.dataset.rename; renderGearPane(); const i=$(".rnIn"); if(i){ i.focus(); i.select(); } return; }
  if(e.target.closest(".rnIn")) return;
  const row = e.target.closest("[data-g]");
  if(row){ U.gearSel=row.dataset.g; U.armed=null; renderGearPane(); rebuildScene(); updateOverlay(); fitView(); setTimeout(()=>{ const n=$("#gName"); if(n) n.scrollIntoView({behavior:"smooth",block:"center"}); },0); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="gNew"){ const id=uid("g"); S.gear[id]={name:"新裝備",cat:"其他",shape:"box",w:50,d:50,h:50,color:"#8A9A7B",notes:""}; U.gearSel=id; saveGear(id); renderGearPane(); renderLayoutPane(); rebuildScene(); updateOverlay(); fitView(); setTimeout(()=>{ const n=$("#gName"); n&&n.select(); },0); return; }
  if(b.id==="gModelDel" && S.gear[U.gearSel]){ const g=S.gear[U.gearSel]; delete g.model; delete g.modelId; saveGear(U.gearSel); renderGearPane(); renderLayoutPane(); rebuildScene(); return; }
  if(b.id==="gDel" && S.gear[U.gearSel]){ if(U.armed!=="gear"){ U.armed="gear"; return renderGearPane(); }
    const id=U.gearSel; delete S.gear[id]; deleteDoc("gear",id);
    Object.entries(S.layouts).forEach(([lid,L])=>{ const n=L.items.length; L.items=L.items.filter(i=>i.gearId!==id); if(L.items.length!==n) saveLayout(lid); });
    U.gearSel=null; U.armed=null; renderAll(); }
});
function finishRename(inp, save){ const id=inp.dataset.rn, g=S.gear[id]; U.renaming=null; if(save && g){ const v=inp.value.trim(); if(v && v!==g.name){ g.name=v; saveGear(id); renderLayoutPane(); rebuildScene(); } } renderGearPane(); }
$("#paneGear").addEventListener("keydown", e => { if(e.target.classList && e.target.classList.contains("rnIn")){ if(e.key==="Enter"){ e.preventDefault(); finishRename(e.target,true); } else if(e.key==="Escape"){ finishRename(e.target,false); } e.stopPropagation(); return; } });
$("#paneGear").addEventListener("focusout", e => { if(e.target.classList && e.target.classList.contains("rnIn") && U.renaming) finishRename(e.target,true); });
$("#paneGear").addEventListener("keydown", e => { const row=e.target.closest("[data-g]"); if(row && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); row.click(); } });
$("#paneGear").addEventListener("change", e => {
  const g = S.gear[U.gearSel]; if(!g) return; const t=e.target;
  if(t.id==="gModel"){ const f=t.files[0]; if(!f) return; const id=U.gearSel; const msg=$("#gModelMsg"); msg.textContent="上傳中…";
    (async()=>{ try{ const assets = window.claude && await claude.use("assets");
      if(!assets){ if(f.size>7e5){ msg.textContent="檔案太大（超過 700KB），網站版請把 .glb 放進 GitHub 的 models 資料夾。"; return; }
        const u = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
        S.gear[id].model=u; delete S.gear[id].modelId; saveGear(id); renderGearPane(); rebuildScene(); return; }
      // the asset store takes JSON but not .glb, so a .glb is wrapped as base64 inside a small JSON file
      let blob = f;
      if(/\.glb$/i.test(f.name)){ const u = new Uint8Array(await f.arrayBuffer()); let bin=""; for(let i=0;i<u.length;i+=32768) bin += String.fromCharCode.apply(null, u.subarray(i,i+32768));
        blob = new File([JSON.stringify({__glb_base64: btoa(bin)})], f.name.replace(/\.glb$/i,".glb.json"), {type:"application/json"}); }
      else if(/\.gltf$/i.test(f.name)) blob = new File([await f.text()], f.name+".json", {type:"application/json"});
      const r = await assets.upload(blob); S.gear[id].model=r.url; S.gear[id].modelId=r.id; saveGear(id); renderGearPane(); rebuildScene(); }
      catch(err){ msg.textContent="上傳失敗：" + (err && (err.message||err.code) || ""); } })(); return; }
  const num = (id, min) => Math.max(min, Math.round((+$(id).value||0)*10)/10);
  if(t.id==="gName") g.name=t.value.trim()||g.name;
  if(t.id==="gCat") g.cat=t.value;
  if(t.id==="gShape") g.shape=t.value;
  if(["gW","gD","gH"].includes(t.id)){ g.w=num("#gW",1); g.d=num("#gD",1); g.h=num("#gH",1); }
  if(t.id==="gCx"||t.id==="gCy"){ g.cx=num("#gCx",0); g.cy=num("#gCy",0); }
  if(t.id==="gT") g.t=num("#gT",1);
  if(t.id==="gSeat") g.seat=num("#gSeat",1);
  if(t.id==="gColor") g.color=t.value;
  if(t.id==="gNotes") g.notes=t.value;
  saveGear(U.gearSel); renderGearPane(); renderLayoutPane(); rebuildScene();
});

/* item ops */
function snapV(v, s){ return U.snap ? Math.round(v/s)*s : v; }
function addItem(gid){
  const L = curLayout(); const b = layoutBounds(L);
  const c = viewCenter() || {x:(b.x0+b.x1)/2, z:(b.z0+b.z1)/2};
  const it = {uid:uid("i"), gearId:gid, x:snapV(c.x,5), y:snapV(c.z,5), rot:0};
  L.items.push(it); U.sel=it.uid; saveLayout(U.layoutId); renderLayoutPane(); rebuildScene();
}
function selItem(){ const L=curLayout(); return L && L.items.find(i=>i.uid===U.sel); }
function selIds(){ return U.sel && U.multi.includes(U.sel) && U.multi.length>1 ? U.multi.slice() : (U.sel ? [U.sel] : []); }
function selItems(){ const L=curLayout(); if(!L) return []; const ids=selIds(); return L.items.filter(i=>ids.includes(i.uid)); }
const isSel = uid => selIds().includes(uid);
function clearSel(){ U.sel=null; U.multi=[]; U.placing=false; }
/* groups: items sharing it.grp are selected, moved, copied and deleted together */
function grpMembers(id){ const L=curLayout(); const it=L&&L.items.find(i=>i.uid===id); if(!it||!it.grp) return [id]; return L.items.filter(i=>i.grp===it.grp).map(i=>i.uid); }
function regroup(list){ const m={}; list.forEach(c=>{ if(c.grp){ m[c.grp]=m[c.grp]||uid("g"); c.grp=m[c.grp]; } }); return list; }
function selectOne(id){ U.multi=grpMembers(id); U.sel=id; }
function groupSel(){ const its=selItems(); if(its.length<2) return; const g=uid("g"); its.forEach(i=>i.grp=g); saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); }
function ungroupSel(){ const its=selItems(); if(!its.some(i=>i.grp)) return; its.forEach(i=>delete i.grp); saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); }
function selectAll(){ const L=curLayout(); if(!L) return; U.multi=L.items.filter(i=>!i.locked && S.gear[i.gearId]).map(i=>i.uid); U.sel=U.multi[U.multi.length-1]||null; rebuildScene(); renderLayoutPane(); }
function toggleSel(id){ let m = selIds(); const g=grpMembers(id); if(m.includes(id)){ m=m.filter(x=>!g.includes(x)); U.multi=m; U.sel=m[m.length-1]||null; } else { g.forEach(x=>{ if(!m.includes(x)) m.push(x); }); U.multi=m; U.sel=id; } }
function moveSel(dx,dy){ selItems().filter(i=>!i.locked).forEach(i=>{ i.x+=dx; i.y+=dy; }); saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); }
function rotateGroup(d){ const its=selItems().filter(i=>!i.locked); if(!its.length) return; const cx=its.reduce((a,i)=>a+i.x,0)/its.length, cy=its.reduce((a,i)=>a+i.y,0)/its.length, r=d*Math.PI/180, c=Math.cos(r), sn=Math.sin(r);
  its.forEach(i=>{ const x=i.x-cx, y=i.y-cy; i.x=Math.round(cx + x*c - y*sn); i.y=Math.round(cy + x*sn + y*c); i.rot=((i.rot+d)%360+360)%360; }); saveLayout(U.layoutId); rebuildScene(); renderLayoutPane(); }

function fpPanelUI(){
  const walk = U.view==="walk";
  $("#fpHelp").innerHTML = walk ? "人物視角：<kbd>W</kbd><kbd>S</kbd> 或 ↑↓ 前進後退、<kbd>A</kbd><kbd>D</kbd> 平移、←→ 轉向、按住 <kbd>Shift</kbd> 跑步。拖曳畫面看四周。" : "自由視角：<kbd>W</kbd><kbd>S</kbd> 朝看的方向飛、<kbd>A</kbd><kbd>D</kbd> 平移、←→ 轉向、<kbd>空白</kbd>/<kbd>C</kbd> 上升下降、<kbd>Shift</kbd> 加速。拖曳畫面看四周。";
  $("#fpUD").hidden = walk; $("#fpEyeRow").hidden = !walk;
}
function fpEnter(v){
  const L=curLayout(); if(!L) return; const b=layoutBounds(L), cx=(b.x0+b.x1)/2, cz=(b.z0+b.z1)/2;
  if(v==="walk"){
    if(FP.init!=="walk"){ FP.x=cx; FP.z=b.z1+120; FP.yaw=0; FP.pitch=-0.08; }
    FP.y=FP.eye; FP.pitch=Math.max(-0.9,Math.min(0.9,FP.pitch));
  } else if(FP.init!=="free"){
    if(FP.init==="walk"){ FP.y=Math.max(FP.y,FP.eye); }
    else { FP.x=perCam.position.x; FP.y=Math.max(60,perCam.position.y); FP.z=perCam.position.z; const d=new THREE.Vector3(); perCam.getWorldDirection(d); FP.yaw=Math.atan2(-d.x,-d.z); FP.pitch=Math.asin(Math.max(-1,Math.min(1,d.y))); }
  }
  FP.init=v; FP.keys={}; fpApply();
}
function fpApply(){ fpCam.position.set(FP.x,FP.y,FP.z); fpCam.rotation.set(FP.pitch, FP.yaw, 0); }
let fpLast = performance.now();
function fpStep(){
  const now=performance.now(), dt=Math.min(0.05,(now-fpLast)/1000); fpLast=now; if(!isFP()) return;
  const k=FP.keys, walk=U.view==="walk", sp=(walk?140:320)*(k.run?2.2:1)*dt, turn=1.6*dt;
  if(k.left) FP.yaw+=turn; if(k.right) FP.yaw-=turn;
  const fx=-Math.sin(FP.yaw), fz=-Math.cos(FP.yaw), rx=Math.cos(FP.yaw), rz=-Math.sin(FP.yaw);
  let f=(k.fwd?1:0)-(k.back?1:0), st=(k.sr?1:0)-(k.sl?1:0);
  if(walk){ FP.x+=(fx*f+rx*st)*sp; FP.z+=(fz*f+rz*st)*sp; FP.y=FP.eye; }
  else { const cp=Math.cos(FP.pitch); FP.x+=(fx*cp*f+rx*st)*sp; FP.z+=(fz*cp*f+rz*st)*sp; FP.y+=Math.sin(FP.pitch)*f*sp + ((k.up?1:0)-(k.down?1:0))*sp; FP.y=Math.max(20,FP.y); }
  fpApply();
}

/* labels + scale bar each frame */
const v3 = new THREE.Vector3();
function updateLabels(cam){
  if(!U.labels) return; const w=stage.clientWidth, h=stage.clientHeight;
  for(const k in labelEls){ const l=labelEls[k]; v3.set(l.x, U.view==="top"&&U.tab!=="gear" ? l.h : l.h+12, l.z).project(cam);
    const vis = v3.z<1 && v3.z>-1; l.el.style.display = vis?"":"none"; if(vis){ l.el.style.left=((v3.x+1)/2*w)+"px"; l.el.style.top=((1-v3.y)/2*h - (U.view==="top"&&U.tab!=="gear"?0:10))+"px"; } }
}
function updateScale(){
  if(U.view!=="top" || U.tab!=="layout") return;
  const pxPerCm = stage.clientHeight / ((topCam.top-topCam.bottom)/topCam.zoom);
  const nice=[10,20,50,100,200,500,1000]; let cm=nice.find(n=>n*pxPerCm>=70)||1000;
  $("#scaleBar").style.width = (cm*pxPerCm)+"px"; $("#scaleTxt").textContent = cm>=100 ? (cm/100)+" m" : cm+" cm";
}
function loop(){ requestAnimationFrame(loop); fpStep(); if(fires.length) animateFires(performance.now()/1000); if(smokes.length||hotBubbles.length) animateSmoke(performance.now()/1000); if(screensOn) drawMovie(performance.now()/1000); else if(movieVideo && !movieVideo.paused) movieVideo.pause(); if(perCtl.enabled) perCtl.update(); const cam=activeCam(); renderer.render(scene, cam); if(cssR){ syncYT(); const live=Object.keys(ytLive).length; if(live){ cssR.render(cssScene, cam); } if(live && scene.background){ stage.style.backgroundColor = "#"+scene.background.getHexString(); scene.background=null; renderer.render(scene, cam); } } updateLabels(cam); updateScale(); }

new ResizeObserver(() => resize()).observe(stage);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => rebuildScene());
new MutationObserver(() => rebuildScene()).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

/* boot */
const _renderAll = renderAll; let firstFit = false;
renderAll = function(){ _renderAll(); if(!firstFit && S.ready){ firstFit = true; fitView(); } };
$("#optRoof").checked = U.showRoof; $("#optFab").value = Math.round(U.fabricOp*100);
setView(U.view); resize(); fitView(); loop(); updateOverlay();
initStore();
})();
</script>
